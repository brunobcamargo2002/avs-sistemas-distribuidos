syntax = "proto3";

option csharp_namespace = "Replication.Contracts";

package replication;

service Storage {
  rpc Write (WriteRequest) returns (WriteResponse);
  rpc Read (ReadRequest) returns (ReadResponse);
  rpc List (ListRequest) returns (ListResponse);
  rpc GetLog (GetLogRequest) returns (GetLogResponse);
}

service ReplicationTransport {
  rpc Fetch (FetchRequest) returns (FetchResponse);
}

message FetchRequest {
  string follower_id = 1;
  int64 last_log_index = 2;
  int64 last_log_term = 3;
}

message FetchResponse {
  string leader_id = 1;
  int64 leader_commit = 2;
  repeated LogEntry entries = 3;
}

message WriteRequest {
  string key = 1;
  string value = 2;
}

message WriteResponse {
  int64 log_index = 1;
  int64 commit_index = 2;
  int64 last_applied = 3;
}

message ReadRequest {
  string key = 1;
}

message ReadResponse {
  string value = 1;
}

message ListRequest {}

message Entry {
  string key = 1;
  string value = 2;
}

message ListResponse {
  repeated Entry entries = 1;
}

message GetLogRequest {}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  string key = 3;
  string value = 4;
  bool is_committed = 5;
}

message GetLogResponse {
  int64 last_log_index = 1;
  int64 commit_index = 2;
  int64 last_applied = 3;
  repeated LogEntry entries = 4;
  string node_id = 5;
  string role = 6;
  string leader_address = 7;
  int32 quorum_size = 8;
  int32 active_nodes = 9;
  bool has_quorum = 10;
  repeated ReplicaProgress replicas = 11;
}

message ReplicaProgress {
  string node_id = 1;
  bool active = 2;
  int64 match_index = 3;
}
